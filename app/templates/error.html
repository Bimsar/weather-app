{% extends "base.html" %}

{% block title %}Something went wrong · Weather App{% endblock %}

{% block content %}
<section class="card error-page">
    <p class="error-emoji" aria-hidden="true">⛈️</p>
    <h1>Sorry, something went wrong</h1>
    <p class="error" role="alert">{{ message }}</p>
    <p><a href="{{ url_for('main.index') }}" class="button">Back to search</a></p>
</section>
{% endblock %}
