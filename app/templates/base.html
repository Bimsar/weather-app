<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    {# viewport tag makes the page scale properly on phones #}
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Weather App{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('main.index') }}" class="logo">🌤️ Weather App</a>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        Weather data by <a href="https://open-meteo.com/">Open-Meteo</a>
    </footer>
</body>
</html>
